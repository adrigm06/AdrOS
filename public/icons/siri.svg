<svg width="256" height="256" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background squircle gradient -->
    <linearGradient id="bgGrad" x1="128" y1="0" x2="128" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1c1f2e" />
      <stop offset="100%" stop-color="#0a0c14" />
    </linearGradient>

    <!-- Top highlight border -->
    <linearGradient id="borderGrad" x1="128" y1="0" x2="128" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.25)" />
      <stop offset="50%" stop-color="rgba(255, 255, 255, 0.05)" />
      <stop offset="100%" stop-color="rgba(0, 0, 0, 0.6)" />
    </linearGradient>

    <!-- Siri Orb Gradients -->
    <radialGradient id="siriCore" cx="45%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="35%" stop-color="#60a5fa" stop-opacity="0.8" />
      <stop offset="70%" stop-color="#8b5cf6" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.4" />
    </radialGradient>

    <linearGradient id="siriGlow1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>

    <linearGradient id="siriGlow2" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="50%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <!-- Apple Intelligence chromatic glow filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="8" y="8" width="240" height="240" rx="54" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2" />

  <!-- Inner ambient glow -->
  <circle cx="128" cy="128" r="85" fill="#a855f7" opacity="0.15" filter="url(#glow)" />
  <circle cx="128" cy="128" r="65" fill="#38bdf8" opacity="0.12" filter="url(#glow)" />

  <!-- Apple Intelligence / Siri Waveform Nodes -->
  <g filter="url(#glow)">
    <!-- Loop 1: Magenta / Pink -->
    <path d="M 80 128 C 80 90, 110 80, 138 98 C 166 116, 176 156, 140 170 C 104 184, 80 155, 80 128 Z"
          fill="none" stroke="url(#siriGlow1)" stroke-width="14" stroke-linecap="round" opacity="0.85" />

    <!-- Loop 2: Cyan / Blue / Violet -->
    <path d="M 176 128 C 176 90, 146 80, 118 98 C 90 116, 80 156, 116 170 C 152 184, 176 155, 176 128 Z"
          fill="none" stroke="url(#siriGlow2)" stroke-width="12" stroke-linecap="round" opacity="0.85" />

    <!-- Inner Core Orb -->
    <circle cx="128" cy="128" r="32" fill="url(#siriCore)" />
  </g>

  <!-- Specular rim highlight -->
  <path d="M 40 14 C 70 9, 186 9, 216 14" stroke="rgba(255, 255, 255, 0.4)" stroke-width="1.5" stroke-linecap="round" />
</svg>